# Exporta a telemetria (OpenF1, gratuita) dos GP que já aconteceram e ainda não estão no site.
# Corre sozinho à segunda e terça de manhã (depois de cada fim-de-semana de corrida).
# Também pode ser lançado à mão: separador Actions → "Telemetria" → Run workflow.
# (O FastF1 deixou de ser usado: desde Outubro de 2026 exige uma assinatura F1 TV.)
name: Telemetria

on:
  schedule:
    - cron: "0 7 * * 1"   # segunda-feira, 07:00 UTC
    - cron: "0 7 * * 2"   # terça-feira (caso os dados ainda não estivessem prontos)
  workflow_dispatch:
    inputs:
      year:
        description: "Época (vazio = ano actual)"
        required: false
        default: ""
      max_events:
        description: "Máximo de GP a exportar nesta execução"
        required: false
        default: "30"

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install numpy

      - name: Exportar GP em falta (OpenF1)
        run: |
          YEAR="${{ github.event.inputs.year }}"
          MAX="${{ github.event.inputs.max_events }}"
          [ -z "$YEAR" ] && YEAR=$(date -u +%Y)
          [ -z "$MAX" ] && MAX=30
          python tools/openf1_export.py "$YEAR" --missing --max-events "$MAX" --no-js

      - name: Guardar no repositório (o Cloudflare publica sozinho)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add htdocs/data/telemetry
          if git diff --cached --quiet; then echo "Sem alterações."; exit 0; fi
          git commit -m "Telemetria actualizada ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done
