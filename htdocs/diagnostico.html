<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico · PITWALL</title>
<style>
body{margin:0;background:#08080c;color:#f2f2f7;font:16px/1.5 system-ui,sans-serif;padding:24px}
h1{font-style:italic;margin:0 0 6px}p{color:#b4b4c4;margin:0 0 18px}
.r{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border:1px solid #2a2a38;border-radius:10px;margin:8px 0;background:#14141c}
.r small{display:block;color:#9a9ab0;font-family:ui-monospace,monospace;font-size:12.5px;word-break:break-all}
button{background:#ff1e2d;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700;cursor:pointer}
textarea{width:100%;height:160px;background:#14141c;color:#ddd;border:1px solid #2a2a38;border-radius:10px;margin-top:12px;font:12px ui-monospace,monospace}
</style>
</head>
<body>
<h1>Diagnóstico do PITWALL</h1>
<p>Testa, a partir do teu browser, cada fonte de dados que o site usa. No fim, carrega em "Copiar relatório" e cola-o na conversa.</p>
<div id="out"></div>
<button id="copy">Copiar relatório</button>
<textarea id="rep" readonly></textarea>
<script>
(async () => {
  const out = document.getElementById('out'), lines = [];
  const add = (ok, name, detail) => {
    const d = document.createElement('div'); d.className = 'r';
    d.innerHTML = `<span>${ok === true ? '✅' : ok === false ? '❌' : '⚠️'}</span><span><b>${name}</b><small></small></span>`;
    d.querySelector('small').textContent = detail; out.append(d);
    lines.push(`${ok === true ? 'OK' : ok === false ? 'FALHA' : 'AVISO'} | ${name} | ${detail}`);
    document.getElementById('rep').value = lines.join('\n');
  };
  async function tryFetch(name, url, check) {
    const t0 = performance.now();
    try {
      const r = await fetch(url, { cache: 'no-store' });
      const ct = r.headers.get('content-type') || '';
      const txt = await r.text();
      const ms = Math.round(performance.now() - t0);
      let res = [r.ok, `HTTP ${r.status} · ${ct} · ${txt.length} bytes · ${ms} ms · início: ${txt.slice(0, 120).replace(/\s+/g, ' ')}`];
      if (r.ok && check) { const c = check(txt, ct); if (c) res = [c[0], c[1] + ' · ' + res[1]]; }
      add(res[0], name, res[1]);
    } catch (e) { add(false, name, `${e.name}: ${e.message} (bloqueado por CORS, rede ou extensão?)`); }
  }
  add(null, 'Página', `${location.href} · ${navigator.userAgent}`);
  const isJson = (txt) => { try { JSON.parse(txt); return null; } catch { return [false, 'não é JSON válido (página de erro/anti-bot do alojamento?)']; } };
  await tryFetch('Jolpica (calendário)', 'https://api.jolpi.ca/ergast/f1/current.json?limit=100', isJson);
  await tryFetch('OpenF1 (sessões)', 'https://api.openf1.org/v1/sessions?year=' + new Date().getFullYear(), isJson);
  await tryFetch('OpenF1 (última sessão)', 'https://api.openf1.org/v1/sessions?session_key=latest', isJson);
  await tryFetch('OpenF1 via proxy do site', 'api/openf1?ep=sessions&q=' + encodeURIComponent('year=' + new Date().getFullYear()), isJson);
  await tryFetch('Proxy de notícias', 'api/news?feeds=bbc', (t) => { try { const d = JSON.parse(t); return [d.items?.length > 0, `${d.items?.length || 0} notícias, erros: ${(d.errors || []).join('; ') || 'nenhum'}`]; } catch { return [false, 'o proxy não devolveu JSON']; } });
  await tryFetch('Notícias alternativa (rss2json)', 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent('https://feeds.bbci.co.uk/sport/formula1/rss.xml'), isJson);
  await tryFetch('Kaggle: data/history/index.json', 'data/history/index.json', isJson);
  await tryFetch('Kaggle: data/history/records.json', 'data/history/records.json', isJson);
  await tryFetch('FastF1: data/telemetry/index.json', 'data/telemetry/index.json', isJson);
  await tryFetch('Script do site', 'assets/js/home.js', (t) => (t.includes('PITWALL') || t.includes('gerado por') ? null : [false, 'ficheiro inesperado']));
  // Leaflet
  await new Promise((res) => {
    const s = document.createElement('script'); s.src = 'assets/vendor/leaflet/leaflet.js';
    s.onload = () => { add(!!window.L, 'Biblioteca do mapa (Leaflet)', window.L ? 'carregou' : 'carregou mas L não existe'); res(); };
    s.onerror = () => { add(false, 'Biblioteca do mapa (Leaflet)', 'não carregou (rede/bloqueador)'); res(); };
    document.head.append(s);
  });
  for (const [n, u] of [['Mosaicos do mapa (CARTO)', 'https://a.basemaps.cartocdn.com/dark_all/2/1/1.png'], ['Mosaicos do mapa (Esri)', 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/2/1/1']]) {
    await new Promise((res) => { const i = new Image(); i.onload = () => { add(true, n, 'imagem carregou'); res(); }; i.onerror = () => { add(false, n, 'imagem não carregou'); res(); }; i.src = u; });
  }
  try { localStorage.setItem('pw-test', '1'); localStorage.removeItem('pw-test'); add(true, 'Armazenamento local', 'disponível'); } catch (e) { add(null, 'Armazenamento local', 'indisponível (não é grave)'); }
  add(null, 'Fim', 'diagnóstico terminado');
})();
document.getElementById('copy').onclick = () => { const t = document.getElementById('rep'); t.select(); navigator.clipboard?.writeText(t.value).catch(() => document.execCommand('copy')); };
</script>
</body>
</html>
